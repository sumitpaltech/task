{% extends "layouts/base.html" %}
{% block title %}Register — TaskApp{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 90vh;">
    <div class="card shadow-sm" style="width: 420px;">
        <div class="card-body p-4">
            <h4 class="fw-bold mb-1"><i class="bi bi-check2-square me-2 text-primary"></i>TaskApp</h4>
            <p class="text-muted mb-4">Create your account</p>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" name="name" class="form-control" placeholder="John Doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="john_doe" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="you@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Department</label>
                    <select name="department" class="form-select" required>
                        <option value="">Select Department</option>
                        <option value="Admin">Admin</option>
                        <option value="Business Intelligence">Business Intelligence</option>
                        <option value="Accounts">Accounts</option>
                        <option value="Design">Design</option>
                        <option value="Product Design">Product Design</option>
                        <option value="Technical">Technical</option>
                        <option value="Tender">Tender</option>
                        <option value="Services">Services</option>
                        <option value="Digital Marketing">Digital Marketing</option>
                        <option value="Ecommerce">Ecommerce</option>
                        <option value="Dispatch">Dispatch</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Costing">Costing</option>
                        <option value="IT">IT</option>
                        <option value="Sales & Marketing">Sales & Marketing</option>
                        <option value="Supply Chain Management">Supply Chain Management</option>
                        <option value="New Project">New Project</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="Min 6 characters" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted mb-0">
                Already have an account?
                <a href="{{ url_for('auth.login') }}" class="fw-semibold">Sign In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
